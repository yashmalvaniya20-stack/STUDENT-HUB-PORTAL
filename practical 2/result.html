<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
</head>
<body>
    <h1 style="text-align: center;">Student Hub Portal</h1>
    <hr>
    <h2 style="text-align: center; text-decoration: underline;">Welcome to the Student Hub Result Page</h2>
    <br>
    <div style="text-align: center;">
        <label for="institute">Institute:</label>
<select name="institute" id="institute">
    <option value="SELECT">Select Institute</option>
  <option value="CSPIT">CSPIT</option>
  <option value="DEPSTAR">DEPSTAR</option>
  <option value="PDPIAS">PDPIAS</option>
</select>
<br><br>
<label for="degree">Degree:</label>
<select name="degree" id="degree">
    <option value="SELECT">Select Degree</option>
    <option value="B.Tech(CE)">B.Tech(CE)</option>
    <option value="B.Tech(IT)">B.Tech(IT)</option>
    <option value="B.Tech(CS)">B.Tech(CS)</option>
</select>
<br><br>
<label for="semester">Semester:</label>
<select name="semester" id="semester">
    <option value="SELECT">Select Semester</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
</select>
<br><br>
<input type="text" placeholder="Enter Your ID" style="padding: 8px; width: 150px; margin-bottom: 20px;margin-left: 115px;">
<br><br>
<button type="submit" style="padding: 20px; width: 300px;">View Result</button>
</body>
</html>
