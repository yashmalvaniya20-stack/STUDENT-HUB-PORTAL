<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1 style="text-align: center;">Student Hub Portal</h1>
    <hr>
    <h2 style="text-align: center; text-decoration: underline;">Welcome to the Student Hub Register Page</h2>
    <br>
    <div style="text-align: center;">
        <input type="text" placeholder="Event Name" style="padding: 20px; width: 300px; margin-bottom: 20px;">
        <br>
        <input type="date" placeholder="Event Date" style="padding: 20px; width: 300px; margin-bottom: 20px;">
        <br>
        <input type="file" placeholder="Certificate" style="padding: 20px; width: 300px; margin-bottom: 20px;">
        <br>
        <button type="submit" style="padding: 20px; width: 300px;">Register</button>
    </div>
</body>
</html>
