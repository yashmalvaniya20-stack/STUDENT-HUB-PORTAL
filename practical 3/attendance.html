<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            padding: 30px;
        }

        .container{
            width: 90%;
            margin: auto;
        }

        h1{
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        h2{
            text-align: center;
            margin: 20px 0;
        }

        hr{
            border: none;
            border-top: 2px solid #999;
            margin: 15px 0;
        }

        .attendance-info{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            padding: 15px 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .attendance-info p{
            font-size: 20px;
            font-weight: bold;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border: 2px solid #000;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

        th{
            border: 1px solid #000;
            padding: 15px;
            font-size: 20px;
            text-align: center;
        }

        td{
            border: 1px solid #000;
            padding: 12px;
            font-size: 18px;
            text-align: center;
        }

        tr:hover{
            background-color: #f2f2f2;
            transition: 0.3s;
        }

        .good{
            font-weight: bold;
        }

        .average{
            font-weight: bold;
        }

        .low{
            font-weight: bold;
        }

        footer{
            margin-top: 25px;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width:768px){

            body{
                padding:15px;
            }

            .attendance-info{
                flex-direction: column;
                gap:10px;
                text-align:center;
            }

            table{
                font-size:14px;
            }

            th,td{
                padding:10px;
            }
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Student Hub Portal</h1>

        <hr>

        <h2>Attendance</h2>

        <div class="attendance-info">
            <p>Lecture Gross Attendance : 80%</p>
            <p>Total Subjects : 5</p>
        </div>

        <table>

            <tr>
                <th>Subject Name</th>
                <th>Lectures Attended</th>
                <th>Attendance %</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>MSUD</td>
                <td>12 / 15</td>
                <td>80%</td>
                <td class="good">Good</td>
            </tr>

            <tr>
                <td>CEUC</td>
                <td>10 / 15</td>
                <td>66.67%</td>
                <td class="low">Low</td>
            </tr>

            <tr>
                <td>DSA</td>
                <td>14 / 15</td>
                <td>93.33%</td>
                <td class="good">Excellent</td>
            </tr>

            <tr>
                <td>WDF</td>
                <td>13 / 15</td>
                <td>86.67%</td>
                <td class="good">Good</td>
            </tr>

            <tr>
                <td>HSUV</td>
                <td>11 / 15</td>
                <td>73.33%</td>
                <td class="average">Average</td>
            </tr>

        </table>

        <footer>
            Student Hub Portal © 2026
        </footer>

    </div>

</body>
</html>
