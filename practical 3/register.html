<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:15px;
            letter-spacing:1px;
        }

        hr{
            border:none;
            border-top:2px solid #999;
            margin:20px 0;
        }

        h2{
            text-align:center;
            margin-bottom:30px;
        }

        .register-box{
            width:450px;
            margin:30px auto;
            padding:30px;
            border:2px solid #ccc;
            border-radius:12px;
            box-shadow:0 5px 12px rgba(0,0,0,0.2);
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            font-size:18px;
            font-weight:bold;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #888;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        input:focus{
            border:2px solid #444;
        }

        button{
            width:100%;
            padding:14px;
            font-size:18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            box-shadow:0 3px 8px rgba(0,0,0,0.2);
            transition:.3s;
        }

        button:hover{
            transform:scale(1.02);
        }

        @media(max-width:768px){

            .register-box{
                width:100%;
            }

            body{
                padding:20px;
            }

        }

    </style>

</head>

<body>

    <h1>Student Hub Portal</h1>

    <hr>

    <h2>Welcome to the Student Hub Register Page</h2>

    <div class="register-box">

        <form>

            <div class="form-group">
                <label for="event">Event Name</label>
                <input type="text" id="event" placeholder="Enter Event Name">
            </div>

            <div class="form-group">
                <label for="date">Event Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="certificate">Certificate</label>
                <input type="file" id="certificate">
            </div>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
